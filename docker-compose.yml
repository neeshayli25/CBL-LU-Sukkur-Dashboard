version: '3.8'

# Primary local path is still npm (see README). This compose file provides
# MySQL + Redis + backend. The frontend service builds the Turborepo
# management dashboard (apps/management-dashboard).

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=secret
      - DB_NAME=cbl_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CLIENT_URL=http://localhost:5173
      - ALLOWED_ORIGINS=http://localhost:5173,http://localhost:3000
      - MAIL_HOST=smtp.gmail.com
      - MAIL_PORT=587
      - MAIL_USER=dev@cblapp.com
      - MAIL_PASSWORD=dev-app-password
      - JWT_ACCESS_SECRET=docker_dev_access_secret_min_32_chars_xx
      - JWT_REFRESH_SECRET=docker_dev_refresh_secret_min_32_chars_x
      - JWT_VERIFY_SECRET=docker_dev_verify_secret_min_32_chars_xx
      - JWT_RESET_SECRET=docker_dev_reset_secret_min_32_chars_xxx
      - ENCRYPTION_KEY=12345678901234567890123456789012
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    image: node:20-bookworm
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --filter=management-dashboard -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5000/api/v1
      - VITE_BYPASS_AUTH=false
    depends_on:
      - backend
    volumes:
      - ./:/app
      - /app/node_modules
      - /app/apps/management-dashboard/node_modules

  mysql:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=secret
      - MYSQL_DATABASE=cbl_db
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-psecret"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  mysql_data:
  redis_data:
