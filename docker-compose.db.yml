# MySQL + Redis only — use this on Windows when local MySQL rejects DB_PASSWORD.
# Avoids fighting an existing Windows MySQL service by publishing MySQL on 3307.
#
# Usage (from repo root):
#   docker compose -f docker-compose.db.yml up -d
#   then set backend/.env DB_PORT=3307 and DB_PASSWORD=secret

services:
  mysql:
    image: mysql:8.0
    container_name: cbl-mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: cbl_db
    command: ["--default-authentication-plugin=mysql_native_password", "--character-set-server=utf8mb4"]
    volumes:
      - cbl_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-psecret"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: cbl-redis
    ports:
      - "6379:6379"
    volumes:
      - cbl_redis_data:/data

volumes:
  cbl_mysql_data:
  cbl_redis_data:
